server:
  port: 8080

spring:
  application:
    name: cachex-concurrent-cache
  codec:
    max-in-memory-size: 10MB

cachex:
  default-capacity: 10
  default-policy: LRU
  default-ttl-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.cachex: DEBUG
